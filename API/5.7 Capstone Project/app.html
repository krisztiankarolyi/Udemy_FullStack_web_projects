<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-dark">
    <div class="container">
        <h1 class="text-center mb-4 text-light">Crypto Portfolio</h1>
        <form id="cryptoForm">
            <div class="table-responsive">
                <table id="cryptoTable" class="table table-dark table-striped text-center">
                    <thead>
                        <tr>
                            <th>ISO Code</th>
                            <th>Quantity</th>
                            <th>Delete</th>
                            <th>Unit Price</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="text-center">
                <button type="button" id="addRowBtn" class="btn btn-outline-light">+</button>
                <button type="button" id="updatePricesBtn" class="btn btn-primary mt-3">Update Prices</button>
                <hr>
            </div>
        </form>
        <h2 class="text-light" id="total">Total: $0.00</h2>
        <p class="text-light">Last updated: <span id="timestamp"></span></p>
    </div>
    
    <script>
        const API_KEY = "7705819d-65da-4278-8a35-3f133ba0b762";
        const PROXY_URL = "https://cors-anywhere.herokuapp.com/";
        const API_URL = "https://pro-api.coinmarketcap.com/v1/cryptocurrency/listings/latest";
        
        document.addEventListener("DOMContentLoaded", () => {
            loadPortfolio();
            document.getElementById("addRowBtn").addEventListener("click", () => addCryptoRow());
            document.getElementById("updatePricesBtn").addEventListener("click", () => updatePortfolio());
        });
        
        function addCryptoRow(crypto = "", quantity = "") {
            const table = document.querySelector("#cryptoTable tbody");
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><input type="text" class="form-control bg-dark text-light" value="${crypto.toUpperCase()}"></td>
                <td><input type="number" class="form-control bg-dark text-light" value="${quantity}" min="0.0000001"></td>
                <td><button type="button" class="btn btn-outline-danger removeRowBtn">-</button></td>
                <td class="price-cell text-light">? $</td>
            `;
            table.appendChild(row);
            row.querySelector(".removeRowBtn").addEventListener("click", () => removeRow(row));
            savePortfolio();
        }
        
        function removeRow(row) {
            row.remove();
            savePortfolio();
        }
        
        function savePortfolio() {
            const rows = document.querySelectorAll("#cryptoTable tbody tr");
            const portfolio = {};
            rows.forEach(row => {
                const iso = row.cells[0].querySelector("input").value.trim().toUpperCase();
                const qty = parseFloat(row.cells[1].querySelector("input").value.trim());
                if (iso && qty > 0) portfolio[iso] = qty;
            });
            localStorage.setItem("cryptoPortfolio", JSON.stringify(portfolio));
        }
        
        function loadPortfolio() {
            const portfolio = JSON.parse(localStorage.getItem("cryptoPortfolio")) || {};
            Object.entries(portfolio).forEach(([crypto, quantity]) => {
                addCryptoRow(crypto, quantity);
            });
        }
        
        async function updatePortfolio() {
            const portfolio = JSON.parse(localStorage.getItem("cryptoPortfolio")) || {};
            if (Object.keys(portfolio).length === 0) return;
            
            try {
                const response = await fetch(API_URL, {
                    headers: { "X-CMC_PRO_API_KEY": API_KEY }
                });
                if (!response.ok) throw new Error("API request failed");
                const data = await response.json();
                const prices = {};
                
                data.data.forEach(coin => {
                    if (portfolio[coin.symbol]) {
                        prices[coin.symbol] = coin.quote.USD.price;
                    }
                });
                
                updatePrices(prices, portfolio);
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }
        
        function updatePrices(prices, portfolio) {
            let total = 0;
            document.querySelectorAll("#cryptoTable tbody tr").forEach(row => {
                const iso = row.cells[0].querySelector("input").value.trim().toUpperCase();
                if (prices[iso]) {
                    const price = prices[iso];
                    const quantity = portfolio[iso];
                    row.cells[3].textContent = `$${price.toFixed(6)}`;
                    total += price * quantity;
                }
            });
            document.getElementById("total").textContent = `Total: $${total.toFixed(2)}`;
            document.getElementById("timestamp").textContent = new Date().toLocaleString();
        }
    </script>
</body>
</html>
